<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon Snake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <h1 class="title">NEON SNAKE</h1>
  <p class="tagline">Eat the food. Grow long. Reach 200 to win. Don't hit the walls — or yourself.</p>
  <div class="game-box">
    <canvas id="game" width="600" height="600" aria-label="Neon Snake game"></canvas>
    <div class="hud" id="hud">
      <span id="hud-score">Score: 0</span>
      <span id="hud-best">Best: 0</span>
      <span id="hud-goal">Goal: 200</span>
    </div>
  </div>
  <div class="settings">
    <label for="speed">Speed / Sensitivity: <span id="speed-val">1.0x</span></label>
    <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1">
  </div>
  <div class="controls">
    <p><strong>Steer:</strong> Arrow keys / WASD, or swipe on the screen</p>
    <p><strong>Start / Restart:</strong> Enter or Space &nbsp;•&nbsp; <strong>Pause:</strong> P &nbsp;•&nbsp; <strong>Mute:</strong> M</p>
    <button id="start-btn" type="button">Play</button>
  </div>
  <p class="foot">A tiny game, drawn entirely in code. No downloads, no sign-up.</p>
</main>
<script src="game.js"></script>
</body>
</html>
